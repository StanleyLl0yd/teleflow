name: TeleFlow Foundation

on:
  push:
    branches:
      - teleflow/foundation-0.1.0
    paths:
      - .github/workflows/teleflow-foundation.yml
      - tools/teleflow/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-foundation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: teleflow/foundation-0.1.0

      - name: Verify pinned upstream base
        shell: bash
        run: |
          git merge-base --is-ancestor 8dc0f52ee5cb17c68ee7b3762edce9a36fcf9955 HEAD

      - name: Apply Foundation source transformations
        run: python3 tools/teleflow/apply-foundation.py .

      - name: Install TeleFlow documentation
        shell: bash
        run: |
          cp tools/teleflow/overlay/README.md README.md
          cp tools/teleflow/overlay/README_RU.md README_RU.md
          cp tools/teleflow/overlay/CHANGELOG.md CHANGELOG.md
          cp tools/teleflow/overlay/CHANGELOG_RU.md CHANGELOG_RU.md
          cp tools/teleflow/overlay/LEGAL LEGAL
          cp tools/teleflow/overlay/docs/TELEFLOW_BUILDING_WIN.md docs/TELEFLOW_BUILDING_WIN.md

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q 'AppName = "TeleFlow"' Telegram/SourceFiles/core/version.h
          grep -q 'OUTPUT_NAME "TeleFlow"' Telegram/CMakeLists.txt
          grep -q 'TeleFlow.TeleFlowDesktop' Telegram/SourceFiles/platform/win/windows_app_user_model_id.cpp
          grep -q 'A71A18F3-931C-4986-AF79-000B3AC9C98F' Telegram/SourceFiles/platform/win/windows_toast_activator.h
          grep -q 'TeleFlow.exe' Telegram/build/setup.iss

      - name: Commit Foundation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md README_RU.md CHANGELOG.md CHANGELOG_RU.md LEGAL \
            docs/TELEFLOW_BUILDING_WIN.md \
            Telegram/SourceFiles/core/version.h \
            Telegram/CMakeLists.txt \
            Telegram/build/setup.iss \
            Telegram/SourceFiles/_other/startup_task_win.cpp \
            Telegram/SourceFiles/_other/updater_win.cpp \
            Telegram/SourceFiles/platform/win/windows_app_user_model_id.cpp \
            Telegram/SourceFiles/platform/win/windows_toast_activator.h \
            Telegram/SourceFiles/platform/win/specific_win.cpp \
            Telegram/Resources/winrc/Telegram.rc \
            Telegram/Resources/winrc/Updater.rc \
            Telegram/SourceFiles/boxes/about_box.cpp
          if git diff --cached --quiet; then
            echo "Foundation is already applied."
          else
            git commit -m "feat: establish TeleFlow 0.1.0 Foundation"
            git push origin HEAD:teleflow/foundation-0.1.0
          fi
